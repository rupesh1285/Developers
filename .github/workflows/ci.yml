name: Finalist CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Install Frontend Dependencies
        working-directory: ./finalist-client
        run: npm install
        
      - name: Build Frontend
        working-directory: ./finalist-client
        run: npm run build

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm install

      - name: Create Dummy .env File
        working-directory: ./server
        run: |
          echo "GOOGLE_CLIENT_ID=dummy_google_id" >> .env
          echo "GOOGLE_CLIENT_SECRET=dummy_google_secret" >> .env
          echo "GITHUB_CLIENT_ID=dummy_github_id" >> .env
          echo "GITHUB_CLIENT_SECRET=dummy_github_secret" >> .env
          echo "JWT_SECRET=dummy_jwt_secret" >> .env
          echo "MONGO_URI=mongodb://localhost:27017/dummy_db" >> .env

      - name: Test Backend Syntax
        working-directory: ./server
        run: node -e "require('./index.js'); setTimeout(() => process.exit(0), 3000);"